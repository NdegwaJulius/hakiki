<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hakiki{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [x-cloak] { display: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

  {% block navbar %}
  {% if request.cookies.get("session") %}
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-8">

      <!-- Brand -->
      <a href="/dashboard" class="flex items-center gap-2 shrink-0">
        <span class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-white text-xs font-bold">H</span>
        <span class="font-semibold text-slate-800 text-sm tracking-tight">Hakiki</span>
      </a>

      <!-- Nav links -->
      <div class="flex items-center gap-1 text-sm">
        <a href="/dashboard"
          class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition font-medium">
          Dashboard
        </a>
        <a href="/billing"
          class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition font-medium">
          Billing
        </a>

        {% if is_admin %}
        <span class="w-px h-4 bg-slate-200 mx-1"></span>

        <!-- Admin dropdown -->
        <div class="relative" id="admin-menu">
          <button onclick="toggleAdminMenu()"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition font-medium">
            Admin
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div id="admin-dropdown"
               class="hidden absolute right-0 mt-1.5 w-44 bg-white border border-slate-200 rounded-xl shadow-lg py-1 z-50">

            <p class="px-3 pt-2 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Users</p>
            <a href="/admin"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Users
            </a>
            <a href="/admin/finance"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Finance
            </a>
            <a href="/admin/config"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Config
            </a>

            <div class="my-1 border-t border-slate-100"></div>

            <p class="px-3 pt-2 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Data</p>
            <a href="/admin/browse"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Browse
            </a>
            <a href="/admin/sources"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Upload
            </a>
            <a href="/admin/status"
               class="flex items-center gap-2 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition">
              Status
            </a>
          </div>
        </div>
        {% endif %}

        <span class="w-px h-4 bg-slate-200 mx-1"></span>
        <a href="/logout"
          class="px-3 py-1.5 rounded-md text-slate-500 hover:text-red-500 hover:bg-red-50 transition font-medium">
          Logout
        </a>
      </div>

    </div>
  </nav>

  <script>
    function toggleAdminMenu() {
      document.getElementById('admin-dropdown').classList.toggle('hidden');
    }
    document.addEventListener('click', function(e) {
      const menu = document.getElementById('admin-menu');
      if (menu && !menu.contains(e.target)) {
        document.getElementById('admin-dropdown').classList.add('hidden');
      }
    });
  </script>
  {% endif %}
  {% endblock %}

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
