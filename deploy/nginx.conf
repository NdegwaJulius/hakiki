# /etc/nginx/sites-available/hakiki
# Symlink: ln -s /etc/nginx/sites-available/hakiki /etc/nginx/sites-enabled/hakiki

upstream hakiki_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── keradata.plunlix.co.ke (frontend + web UI) ────────────────────────────────
server {
    listen 80;
    server_name keradata.plunlix.co.ke;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name keradata.plunlix.co.ke;

    # SSL — filled in by: sudo certbot --nginx -d keradata.plunlix.co.ke
    ssl_certificate     /etc/letsencrypt/live/keradata.plunlix.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keradata.plunlix.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    location / {
        proxy_pass         http://hakiki_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── api.plunlix.co.ke (REST API) ──────────────────────────────────────────────
server {
    listen 80;
    server_name api.plunlix.co.ke;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.plunlix.co.ke;

    ssl_certificate     /etc/letsencrypt/live/api.plunlix.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.plunlix.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;

    # CORS — allow any origin to call the API
    add_header Access-Control-Allow-Origin  "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "X-API-Key, Content-Type";

    location / {
        if ($request_method = OPTIONS) { return 204; }

        proxy_pass         http://hakiki_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
